<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bia Pinhal Moda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090807;
    --surface:#14110d;
    --line: rgba(212,170,84,0.30);
    --text:#f8f3e7;
    --text-dim:#9d9283;
    --accent:#d4aa54;
    --accent-2:#f0d9a2;
    --whatsapp:#25d366;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Jost', system-ui, sans-serif;
    display:flex;
    justify-content:center;
    -webkit-text-size-adjust:100%;
  }

  .page{
    width:100%;
    max-width:480px;
    min-height:100%;
    background:var(--bg);
    position:relative;
  }

  /* ---------- HERO ---------- */
  .hero-card{
    margin: 22px 22px 0;
    border-radius:20px;
    overflow:hidden;
    aspect-ratio: 4 / 5;
    background:#000;
    border:1px solid var(--line);
    box-shadow: 0 24px 46px -26px rgba(0,0,0,0.8);
  }
  .hero-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position: 50% 46%;
    display:block;
  }

  /* ---------- BRAND ---------- */
  .brand-block{
    text-align:center;
    padding: 26px 24px 4px;
  }
  .brand{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(32px, 9vw, 42px);
    line-height:1.05;
    color:var(--text);
    margin:0;
    text-wrap:balance;
  }
  .brand-rule{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:10px 0 0;
  }
  .brand-rule::before,
  .brand-rule::after{
    content:"";
    width:26px;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }
  .brand-rule::after{ background: linear-gradient(90deg, var(--accent), transparent); }
  .brand-rule span{
    font-family:'Jost', sans-serif;
    font-size:11.5px;
    font-weight:500;
    letter-spacing:.28em;
    color:var(--accent-2);
    text-transform:uppercase;
  }

  /* ---------- LINKS ---------- */
  .content{
    padding: 22px 22px calc(28px + env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    border-radius:13px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    text-decoration:none;
    font-family:'Jost', sans-serif;
    font-weight:500;
    font-size:14.5px;
    letter-spacing:.01em;
    --fade:.8s;
    position:relative;
    overflow:hidden;
    isolation:isolate;
    transition: color var(--fade) ease, border-color var(--fade) ease, box-shadow var(--fade) ease, transform .15s ease;
  }
  .link-btn::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    opacity:0;
    transition: opacity var(--fade) ease;
  }
  .link-btn::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:0;
    width:38%;
    background: linear-gradient(100deg, transparent, rgba(240,217,162,0.22), transparent);
    transform: translateX(-130%) skewX(-20deg);
    pointer-events:none;
  }
  .link-btn:focus-visible{ outline:2px solid var(--accent-2); outline-offset:3px; }

  .link-btn:active,
  .link-btn:focus-visible{
    --fade:.15s;
    color:#241b0a;
    border-color:transparent;
  }
  .link-btn:active::before,
  .link-btn:focus-visible::before{ opacity:1; }
  .link-btn:active .icon,
  .link-btn:active .arrow,
  .link-btn:focus-visible .icon,
  .link-btn:focus-visible .arrow{ color:#241b0a; opacity:1; }
  .link-btn:active{ transform: scale(0.98); }

  @media (hover:hover){
    .link-btn:hover{
      --fade:.25s;
      color:#241b0a;
      border-color:transparent;
      box-shadow: 0 16px 30px -14px rgba(212,170,84,0.6);
      transform: translateY(-2px);
    }
    .link-btn:hover::before{ opacity:1; }
    .link-btn:hover .icon,
    .link-btn:hover .arrow{ color:#241b0a; opacity:1; }
  }

  .link-btn .icon{
    flex:none;
    width:20px;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent-2);
    transition: color var(--fade) ease;
  }
  .link-btn .icon svg{ width:20px; height:20px; }

  .link-btn .label{ flex:1; font-weight:600; }
  .link-btn .label small{ display:block; margin-top:3px; font-size:11.5px; font-weight:400; line-height:1.35; letter-spacing:.01em; color:inherit; opacity:.65; }
  .link-btn .arrow{ flex:none; color:var(--accent); font-size:15px; line-height:1; opacity:.85; transition: color var(--fade) ease, opacity var(--fade) ease; }

  .sign-off{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding-top:16px;
  }
  .monogram{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:15px;
    color:var(--accent-2);
  }
  .sign-off span{
    font-size:10px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--text-dim);
    text-align:center;
  }

  @media (prefers-reduced-motion: no-preference){
    .hero-card, .brand-block, .content > *{
      animation: rise .6s cubic-bezier(.2,.7,.2,1) both;
    }
    .brand-block{ animation-delay:.05s; }
    .content > *:nth-child(1){ animation-delay:.1s; }
    .content > *:nth-child(2){ animation-delay:.15s; }
    .content > *:nth-child(3){ animation-delay:.2s; }
    .content > *:nth-child(4){ animation-delay:.25s; }
    .content > *:nth-child(5){ animation-delay:.3s; }
    @keyframes rise{
      from{ opacity:0; transform:translateY(10px); }
      to{ opacity:1; transform:translateY(0); }
    }
    @keyframes sheen{
      0%, 55%{ transform: translateX(-130%) skewX(-20deg); }
      100%{ transform: translateX(380%) skewX(-20deg); }
    }
    .link-btn::after{ animation: sheen 5s ease-in-out infinite; }
    .content > a:nth-of-type(2)::after{ animation-delay:.7s; }
    .content > a:nth-of-type(3)::after{ animation-delay:1.4s; }
    .content > a:nth-of-type(4)::after{ animation-delay:2.1s; }
  }
</style>
</head>
<body>
